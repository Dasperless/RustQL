name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag override (e.g. v0.2.0)"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare-release:
    name: Calculate Version & Create Tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_version: ${{ steps.resolve.outputs.release_version }}
      should_release: ${{ steps.resolve.outputs.should_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        if: github.event.inputs.tag == ''
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          tag_prefix: v

      - name: Set release outputs
        id: resolve
        run: |
          set -euo pipefail
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            RAW_TAG="${{ github.event.inputs.tag }}"
            RELEASE_VER="${RAW_TAG#v}"
            RELEASE_TAG="v${RELEASE_VER}"
            SHOULD_RELEASE="true"
          else
            NEW_TAG="${{ steps.tag_version.outputs.new_tag }}"
            NEW_VER="${{ steps.tag_version.outputs.new_version }}"
            if [[ -n "$NEW_TAG" ]]; then
              RELEASE_TAG="$NEW_TAG"
              RELEASE_VER="${NEW_VER:-${NEW_TAG#v}}"
              SHOULD_RELEASE="true"
            else
              RELEASE_TAG=""
              RELEASE_VER=""
              SHOULD_RELEASE="false"
            fi
          fi
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_version=${RELEASE_VER}" >> "$GITHUB_OUTPUT"
          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"

  build-release:
    name: Build Release (${{ matrix.target }})
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install musl tools (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Sync Cargo.toml version with release tag
        shell: bash
        run: |
          RELEASE_VER="${{ needs.prepare-release.outputs.release_version }}"
          RELEASE_TAG="${{ needs.prepare-release.outputs.release_tag }}"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_VER=${RELEASE_VER}" >> "$GITHUB_ENV"

          python3 -c '
          import pathlib, re, sys
          ver = sys.argv[1]
          p = pathlib.Path("Cargo.toml")
          text = p.read_text(encoding="utf-8")
          new_text = re.sub(r"(?m)^version\s*=\s*\"[^\"]+\"", f"version = \"{ver}\"", text, count=1)
          p.write_text(new_text, encoding="utf-8")
          ' "$RELEASE_VER"
          cargo generate-lockfile

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Sign and verify macOS Mach-O binary
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - "target/${{ matrix.target }}/release/rustql"
          codesign --verify --verbose "target/${{ matrix.target }}/release/rustql"

      - name: Smoke test compiled release binary
        shell: bash
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/rustql"
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN_PATH="target/${{ matrix.target }}/release/rustql.exe"
          fi
          if [ "${{ matrix.target }}" != "x86_64-apple-darwin" ]; then
            "$BIN_PATH" --version
            "$BIN_PATH" -q "SELECT COUNT(*) FROM users" examples/users.json
          fi

      - name: Package versioned release archive (Unix)
        if: runner.os != 'Windows'
        run: |
          STAGE_DIR="rustql-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "$STAGE_DIR"
          cp "target/${{ matrix.target }}/release/rustql" "$STAGE_DIR/"
          cp README.md LICENSE SECURITY.md install.sh "$STAGE_DIR/"
          tar -czf "${STAGE_DIR}.tar.gz" "$STAGE_DIR"
          shasum -a 256 "${STAGE_DIR}.tar.gz" > "${STAGE_DIR}.tar.gz.sha256"

      - name: Package versioned release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $StageDir = "rustql-$env:RELEASE_TAG-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $StageDir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rustql.exe" "$StageDir/"
          Copy-Item README.md, LICENSE, SECURITY.md, install.ps1 "$StageDir/"
          Compress-Archive -Path "$StageDir" -DestinationPath "$StageDir.zip" -Force
          $Hash = (Get-FileHash -Algorithm SHA256 "$StageDir.zip").Hash.ToLower()
          "$Hash  $StageDir.zip" | Out-File -Encoding ascii "$StageDir.zip.sha256"

      - name: Attest build provenance for release archive
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "rustql-${{ env.RELEASE_TAG }}-${{ matrix.target }}.${{ matrix.archive_ext }}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            rustql-${{ env.RELEASE_TAG }}-${{ matrix.target }}.${{ matrix.archive_ext }}
            rustql-${{ env.RELEASE_TAG }}-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256

  publish-release:
    name: Publish GitHub Release
    needs: [prepare-release, build-release]
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate combined SHA256SUMS
        run: |
          cd artifacts
          cat *.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          name: ${{ needs.prepare-release.outputs.release_tag }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS
            artifacts/*.sha256

