name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag override (e.g. v0.2.0)"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare-release:
    name: Determine Version & Create Tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_version: ${{ steps.version.outputs.release_version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version and create tag on main push
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Skip automated release if commit message explicitly requests [skip release]
          HEAD_SUBJECT=$(git log -1 --pretty=%s)
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            if [[ "$HEAD_SUBJECT" == *"[skip release]"* ]]; then
              echo "Skipping release for commit: $HEAD_SUBJECT"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "release_tag=" >> "$GITHUB_OUTPUT"
              echo "release_version=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          git fetch --tags --force
          CARGO_VER=$(grep '^version =' Cargo.toml | head -n1 | cut -d'"' -f2)

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.tag }}" ]]; then
            RAW_TAG="${{ github.event.inputs.tag }}"
            RELEASE_VER="${RAW_TAG#v}"
            RELEASE_TAG="v${RELEASE_VER}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_TAG="${{ github.ref_name }}"
            RELEASE_VER="${RAW_TAG#v}"
            RELEASE_TAG="v${RELEASE_VER}"
            # If this tag already has a published GitHub Release (e.g. created by the push-to-main run), avoid duplicate work
            if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "GitHub Release $RELEASE_TAG already exists; skipping duplicate tag-push run."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
              echo "release_version=$RELEASE_VER" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            # Push to main (or workflow_dispatch without tag input):
            # 1. If HEAD is already tagged with v*.*.* and that release already exists, skip.
            HEAD_TAG=$(git tag --points-at HEAD 'v*.*.*' | sort -V | tail -n1 || true)
            if [[ -n "$HEAD_TAG" ]] && gh release view "$HEAD_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "HEAD is already tagged ($HEAD_TAG) and published; skipping."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "release_tag=$HEAD_TAG" >> "$GITHUB_OUTPUT"
              echo "release_version=${HEAD_TAG#v}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # 2. Find latest existing semver tag vX.Y.Z
            LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1 || true)
            if [[ -z "$LATEST_TAG" ]]; then
              RELEASE_VER="$CARGO_VER"
            else
              LATEST_VER="${LATEST_TAG#v}"
              # Check if Cargo.toml version is strictly greater than LATEST_VER
              HIGHEST=$(printf '%s\n%s\n' "$LATEST_VER" "$CARGO_VER" | sort -V | tail -n1)
              if [[ "$CARGO_VER" != "$LATEST_VER" && "$HIGHEST" == "$CARGO_VER" ]]; then
                RELEASE_VER="$CARGO_VER"
              else
                IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VER"
                COMMITS_SINCE=$(git log "${LATEST_TAG}..HEAD" --pretty=%s || git log -1 --pretty=%s)
                if echo "$COMMITS_SINCE" | grep -Eq '^(feat|feature)(\([^)]+\))?!?:|BREAKING CHANGE'; then
                  MINOR=$((MINOR + 1))
                  PATCH=0
                else
                  PATCH=$((PATCH + 1))
                fi
                RELEASE_VER="${MAJOR}.${MINOR}.${PATCH}"
              fi
            fi
            RELEASE_TAG="v${RELEASE_VER}"

            # 3. Create and push the Git tag pointing at the main commit if it doesn't exist yet
            if ! git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Creating and pushing new tag $RELEASE_TAG on ${{ github.sha }}..."
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$RELEASE_TAG" "${{ github.sha }}" -m "Release $RELEASE_TAG"
              git push origin "refs/tags/$RELEASE_TAG"
            fi
          fi

          echo "Resolved release version: $RELEASE_VER (tag: $RELEASE_TAG)"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VER" >> "$GITHUB_OUTPUT"

  build-release:
    name: Build Release (${{ matrix.target }})
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install musl tools (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Sync Cargo.toml version with release tag
        shell: bash
        run: |
          RELEASE_VER="${{ needs.prepare-release.outputs.release_version }}"
          RELEASE_TAG="${{ needs.prepare-release.outputs.release_tag }}"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_VER=${RELEASE_VER}" >> "$GITHUB_ENV"

          python3 -c '
          import pathlib, re, sys
          ver = sys.argv[1]
          p = pathlib.Path("Cargo.toml")
          text = p.read_text(encoding="utf-8")
          new_text = re.sub(r"(?m)^version\s*=\s*\"[^\"]+\"", f"version = \"{ver}\"", text, count=1)
          p.write_text(new_text, encoding="utf-8")
          ' "$RELEASE_VER"
          cargo generate-lockfile

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Sign and verify macOS Mach-O binary
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - "target/${{ matrix.target }}/release/rustql"
          codesign --verify --verbose "target/${{ matrix.target }}/release/rustql"

      - name: Smoke test compiled release binary
        shell: bash
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/rustql"
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN_PATH="target/${{ matrix.target }}/release/rustql.exe"
          fi
          if [ "${{ matrix.target }}" != "x86_64-apple-darwin" ]; then
            "$BIN_PATH" --version
            "$BIN_PATH" -q "SELECT COUNT(*) FROM users" examples/users.json
          fi

      - name: Package versioned release archive (Unix)
        if: runner.os != 'Windows'
        run: |
          STAGE_DIR="rustql-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "$STAGE_DIR"
          cp "target/${{ matrix.target }}/release/rustql" "$STAGE_DIR/"
          cp README.md LICENSE SECURITY.md install.sh "$STAGE_DIR/"
          tar -czf "${STAGE_DIR}.tar.gz" "$STAGE_DIR"
          shasum -a 256 "${STAGE_DIR}.tar.gz" > "${STAGE_DIR}.tar.gz.sha256"

      - name: Package versioned release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $StageDir = "rustql-$env:RELEASE_TAG-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $StageDir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rustql.exe" "$StageDir/"
          Copy-Item README.md, LICENSE, SECURITY.md, install.ps1 "$StageDir/"
          Compress-Archive -Path "$StageDir" -DestinationPath "$StageDir.zip" -Force
          $Hash = (Get-FileHash -Algorithm SHA256 "$StageDir.zip").Hash.ToLower()
          "$Hash  $StageDir.zip" | Out-File -Encoding ascii "$StageDir.zip.sha256"

      - name: Attest build provenance for release archive
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "rustql-${{ env.RELEASE_TAG }}-${{ matrix.target }}.${{ matrix.archive_ext }}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            rustql-${{ env.RELEASE_TAG }}-${{ matrix.target }}.${{ matrix.archive_ext }}
            rustql-${{ env.RELEASE_TAG }}-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256

  publish-release:
    name: Publish GitHub Release
    needs: [prepare-release, build-release]
    if: needs.prepare-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate combined SHA256SUMS
        run: |
          cd artifacts
          cat *.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          name: ${{ needs.prepare-release.outputs.release_tag }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS
            artifacts/*.sha256

