[package]
name = "rustrix"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["Darío Vargas <https://github.com/Dasperless>"]
description = "A pure-Rust terminal UI (TUI) and CLI for running SQL queries against JSON and NDJSON files"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Dasperless/Rustrix"
documentation = "https://docs.rs/rustrix"
keywords = ["sql", "json", "ndjson", "tui", "cli"]
categories = ["command-line-utilities", "database"]
exclude = [".github/"]

[[bin]]
name = "rustrix"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sqlparser = "0.53"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.14"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

