[package]
name = "rustrix"
version = "0.1.0"
edition = "2021"
description = "A pure-Rust terminal UI (TUI) and CLI for running SQL queries against JSON files"
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sqlparser = "0.53"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.14"
